<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>簽名板</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="簽名板">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f9d55">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* 版面：簽名板永遠橫向（左邊簽名紙、右邊直排按鍵）。開啟 Word 後先顯示文件，點簽名框才跳出簽名板。 */
:root {
  --bg: #e4e7ea;
  --text: #1b2430;
  --muted: #647080;
  --line: #c5ccd3;
  --paper: #fdfdf9;
  --chip: #ffffff;
  --doc: #1f5fbf;
  --key-clear: #f2c230;
  --key-clear-text: #3a2c00;
  --key-ok: #1f9d55;
  --key-ok-text: #ffffff;
  --key-plain: #ffffff;
  --warn: #b4431f;
  --font-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* 瀏海與底部橫條的安全邊距（由 JS 依方向換算） */
  --pt: 10px; --pr: 16px; --pb: 12px; --pl: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181d; --text: #e8ecf0; --muted: #94a0ad; --line: #36404b;
    --paper: #f3f1e8; --chip: #222a32; --key-plain: #2a323b; --doc: #6ea2f0; --warn: #f08a63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181d; --text: #e8ecf0; --muted: #94a0ad; --line: #36404b;
  --paper: #f3f1e8; --chip: #222a32; --key-plain: #2a323b; --doc: #6ea2f0; --warn: #f08a63;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body {
  color: var(--text); font-family: var(--font-body);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#safe {
  position: fixed; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#stage { position: fixed; left: 0; top: 0; transform-origin: 0 0; background: var(--bg); }
.app {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: 1fr 112px; gap: 12px;
  padding: var(--pt) var(--pr) var(--pb) var(--pl);
}
.left { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
header { display: flex; align-items: center; gap: 10px; min-width: 0; }
h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .04em; flex: none; }
.filebtn {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 14px; font-weight: 600; color: var(--doc);
  border: 1px solid var(--doc); border-radius: 8px; padding: 6px 10px; min-height: 0; cursor: pointer;
  background: var(--chip);
}
.filebtn input { display: none; }
.docinfo {
  flex: 1; min-width: 0; font-size: 13px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.docinfo b { color: var(--text); font-weight: 600; }
.docinfo.err { color: var(--warn); }
.stamp { flex: none; font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.pad {
  position: relative; flex: 1; min-height: 0;
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; touch-action: none;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.guide { position: absolute; left: 5%; right: 5%; bottom: 26%; border-bottom: 1.5px dashed #9aa3ad; pointer-events: none; }
.guide::before { content: "✕"; position: absolute; left: 0; bottom: 6px; font-size: 22px; color: #7a8591; line-height: 1; }
.hint {
  position: absolute; left: 0; right: 0; bottom: calc(26% - 30px);
  text-align: center; font-size: 14px; color: #7a8591; letter-spacing: .15em;
  pointer-events: none; transition: opacity .2s;
}
.pad.signed .hint { opacity: 0; }
.target {
  position: absolute; left: 12px; top: 10px; pointer-events: none;
  font-size: 13px; font-weight: 600; color: #1f5fbf;
  background: #e8f0fc; border-radius: 6px; padding: 4px 8px;
}

.keys { display: flex; flex-direction: column; gap: 10px; }
.keys button { flex: 1; }
.keys .k-ok { flex: 1.5; }
button {
  font: inherit; font-size: 17px; font-weight: 600;
  min-height: 48px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--key-plain); color: var(--text);
  cursor: pointer; touch-action: manipulation;
}
button:active { transform: translateY(1px); filter: brightness(.94); }
button:focus-visible, .filebtn:focus-within { outline: 3px solid #4c8dff; outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; transform: none; filter: none; }
.k-clear { background: var(--key-clear); color: var(--key-clear-text); border-color: transparent; }
.k-ok { background: var(--key-ok); color: var(--key-ok-text); border-color: transparent; }
.k-doc { background: #1f5fbf; color: #fff; border-color: transparent; }

.done {
  position: absolute; inset: 0; background: var(--bg);
  display: none; grid-template-columns: 1fr 170px; gap: 12px;
  padding: var(--pt) var(--pr) var(--pb) var(--pl);
}
.done.show { display: grid; }
.done h2 { margin: 0; font-size: 16px; font-weight: 600; }
.preview {
  flex: 1; min-height: 0;
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; padding: 10px;
}
.preview.clear-bg {
  background-color: #fff;
  background-image:
    linear-gradient(45deg, #dfe3e7 25%, transparent 25%, transparent 75%, #dfe3e7 75%),
    linear-gradient(45deg, #dfe3e7 25%, transparent 25%, transparent 75%, #dfe3e7 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px;
}
.preview img {
  max-width: 100%; max-height: 100%; display: block;
  -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
}
.side { display: flex; flex-direction: column; gap: 10px; }
.side button { flex: 1; }
.opt { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 1.3; }
.opt input { width: 22px; height: 22px; flex: none; accent-color: var(--key-ok); }
.note { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.4; }
.note.err { color: var(--warn); }

/* ---------- 文件檢視（不旋轉，跟手機方向） ---------- */
#docview {
  position: fixed; inset: 0; z-index: 10;
  display: none; flex-direction: column; background: var(--bg);
}
#docview.show { display: flex; }
.dv-bar {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px);
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.dv-bar button { min-height: 40px; font-size: 15px; padding: 0 14px; flex: none; }
.dv-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dv-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dv-count.ok { color: var(--key-ok); font-weight: 600; }
#docbody {
  flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch;
  background: #8a939c;
}
#docbody .docx-wrapper { background: #8a939c; padding: 16px; }
#docbody .docx-wrapper > section.docx { margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
.dv-note {
  flex: none; margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4;
  padding: 8px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px);
  border-top: 1px solid var(--line); background: var(--bg);
}
.dv-note.err { color: var(--warn); }

/* 文件裡的簽名框（單位跟著文件走，會一起縮放） */
.sigspot {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 5cm; min-height: 1.4cm; padding: 2pt 6pt; margin: 0;
  font: 600 11pt/1.2 var(--font-body); color: #1f5fbf;
  background: rgba(31, 95, 191, .10); border: 2px dashed #1f5fbf; border-radius: 4pt;
  vertical-align: middle; cursor: pointer;
  animation: blink 1.6s ease-in-out infinite;
}
.sigspot.is-signed { background: transparent; border-color: rgba(31, 95, 191, .35); animation: none; padding: 0 4pt; }
.sigspot img { display: block; max-width: 5cm; max-height: 1.4cm; }
@keyframes blink { 50% { background: rgba(31, 95, 191, .22); } }

[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } button:active { transform: none; } .sigspot { animation: none; } }
</style>
</head>
<body>
<div id="safe"></div>
<div id="stage">
  <div class="app">
    <div class="left">
      <header>
        <h1>簽名板</h1>
        <label class="filebtn" for="file" id="openBtn">開啟 Word<input type="file" id="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label>
        <button type="button" class="filebtn" id="toDoc" hidden>← 返回文件</button>
        <span class="docinfo" id="docinfo">開啟 Word 後，點文件裡的簽名框就能簽</span>
        <span class="stamp" id="stamp"></span>
      </header>
      <div class="pad" id="pad">
        <div class="target" id="target" hidden></div>
        <div class="guide"></div>
        <div class="hint" id="hint">請在此簽名</div>
        <canvas id="cv" aria-label="簽名區，用手指或觸控筆簽名"></canvas>
      </div>
    </div>
    <div class="keys">
      <button type="button" id="undo" disabled>復原</button>
      <button type="button" id="clear" class="k-clear" disabled>清除</button>
      <button type="button" id="ok" class="k-ok" disabled>確認</button>
    </div>
  </div>

  <div class="done" id="done" aria-live="polite">
    <div class="left">
      <h2>簽名完成</h2>
      <div class="preview" id="preview"><img id="out" alt="您的簽名"></div>
      <p class="note" id="note">按「儲存圖片」，或長按圖片存到照片。</p>
    </div>
    <div class="side">
      <label class="opt" for="transparent"><input type="checkbox" id="transparent"> 透明背景</label>
      <button type="button" id="save" class="k-ok">儲存圖片</button>
      <button type="button" id="back">重新簽名</button>
    </div>
  </div>
</div>

<div id="docview" aria-live="polite">
  <div class="dv-bar">
    <button type="button" id="dvClose">關閉</button>
    <div class="dv-title">
      <span class="dv-name" id="dvName"></span>
      <span class="dv-count" id="dvCount"></span>
    </div>
    <button type="button" id="dvSave" class="k-doc" disabled>儲存 Word</button>
  </div>
  <div id="docbody"></div>
  <p class="dv-note" id="dvNote">點藍色閃爍的框簽名。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.7/dist/docx-preview.min.js"></script>
<script>
// 把 docx 裡的 {{標記}} 換成簽名圖片或文字。瀏覽器與 Node 共用。
// deps: { JSZip, DOMParser, XMLSerializer }
var DocxFill = (function () {
  var W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  var NS_DECL =
    ' xmlns:w="' + W + '"' +
    ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"' +
    ' xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"' +
    ' xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"' +
    ' xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
  var MARK = /\{\{\s*([^{}]+?)\s*\}\}/g;

  function isSign(name) { return /簽|sign/i.test(name); }
  function isDate(name) { return /日期|date/i.test(name); }

  function paragraphs(doc) { return doc.getElementsByTagNameNS(W, 'p'); }
  function texts(p) {
    var out = [], all = p.getElementsByTagNameNS(W, 't');
    for (var i = 0; i < all.length; i++) out.push(all[i]);
    return out;
  }

  // 列出文件中的標記（依出現順序、去重）
  function scan(xml, dp) {
    var doc = new dp().parseFromString(xml, 'application/xml');
    var ps = paragraphs(doc), seen = {}, list = [];
    for (var i = 0; i < ps.length; i++) {
      var full = texts(ps[i]).map(function (t) { return t.textContent; }).join('');
      var m; MARK.lastIndex = 0;
      while ((m = MARK.exec(full))) {
        if (!seen[m[1]]) { seen[m[1]] = 1; list.push({ name: m[1], kind: isSign(m[1]) ? 'sign' : isDate(m[1]) ? 'date' : 'text' }); }
      }
    }
    return list;
  }

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function imageRunXml(rId, id, cx, cy, rPrXml) {
    return '<w:r' + NS_DECL + '>' + (rPrXml || '') +
      '<w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">' +
      '<wp:extent cx="' + cx + '" cy="' + cy + '"/>' +
      '<wp:effectExtent l="0" t="0" r="0" b="0"/>' +
      '<wp:docPr id="' + id + '" name="簽名 ' + id + '"/>' +
      '<wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>' +
      '<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<pic:pic><pic:nvPicPr><pic:cNvPr id="' + id + '" name="signature' + id + '.png"/><pic:cNvPicPr/></pic:nvPicPr>' +
      '<pic:blipFill><a:blip r:embed="' + rId + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
      '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>' +
      '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
  }
  function textRunXml(text, rPrXml) {
    return '<w:r' + NS_DECL + '>' + (rPrXml || '') + '<w:t xml:space="preserve">' + esc(text) + '</w:t></w:r>';
  }

  /**
   * values: { 標記名: {type:'image', png:Uint8Array, w:px, h:px} | {type:'text', text:'...'} }
   * opts: { maxW: cm, maxH: cm }
   * 回傳新的 docx (Uint8Array)
   */
  async function fill(data, values, deps, opts) {
    opts = opts || {};
    var maxW = (opts.maxW || 5) * 360000, maxH = (opts.maxH || 1.6) * 360000;
    var zip = await deps.JSZip.loadAsync(data);
    var dp = deps.DOMParser, xs = new deps.XMLSerializer();
    var docXml = await zip.file('word/document.xml').async('string');
    var relsPath = 'word/_rels/document.xml.rels';
    var relsXml = zip.file(relsPath) ? await zip.file(relsPath).async('string')
      : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
    var ctXml = await zip.file('[Content_Types].xml').async('string');

    var doc = new dp().parseFromString(docXml, 'application/xml');
    var rels = new dp().parseFromString(relsXml, 'application/xml');
    var RELNS = 'http://schemas.openxmlformats.org/package/2006/relationships';

    // 下一個可用的 rId 與 docPr id
    var maxR = 0, relEls = rels.getElementsByTagNameNS(RELNS, 'Relationship');
    for (var i = 0; i < relEls.length; i++) {
      var n = parseInt((relEls[i].getAttribute('Id') || '').replace(/\D/g, ''), 10);
      if (n > maxR) maxR = n;
    }
    var nextId = 9000;
    var imgRid = {};   // 同一個標記只放一次圖檔
    var count = 0;

    function rIdFor(name, v) {
      if (imgRid[name]) return imgRid[name];
      maxR += 1;
      var rId = 'rIdSig' + maxR;
      var file = 'media/signature_' + maxR + '.png';
      zip.file('word/' + file, v.png);
      var rel = rels.createElementNS(RELNS, 'Relationship');
      rel.setAttribute('Id', rId);
      rel.setAttribute('Type', 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/image');
      rel.setAttribute('Target', file);
      rels.documentElement.appendChild(rel);
      imgRid[name] = rId;
      return rId;
    }

    var ps = paragraphs(doc);
    for (var pi = 0; pi < ps.length; pi++) {
      var p = ps[pi];
      // 處理一個標記後重新讀取，直到這段沒有可替換的標記
      for (var guard = 0; guard < 50; guard++) {
        var ts = texts(p);
        var full = '', starts = [];
        ts.forEach(function (t) { starts.push(full.length); full += t.textContent; });
        MARK.lastIndex = 0;
        var m, hit = null;
        while ((m = MARK.exec(full))) { if (values[m[1]]) { hit = m; break; } }
        if (!hit) break;
        var s = hit.index, e = hit.index + hit[0].length, v = values[hit[1]];

        var first = -1;
        for (var k = 0; k < ts.length; k++) {
          var a = starts[k], b = a + ts[k].textContent.length;
          if (b <= s || a >= e) continue;
          var txt = ts[k].textContent;
          var cutA = Math.max(s - a, 0), cutB = Math.min(e - a, txt.length);
          if (first < 0) {
            first = k;
            // 開頭那段：留前綴；把後綴拆到新的 run 之後
            var prefix = txt.slice(0, cutA), suffix = (e - a < txt.length) ? txt.slice(cutB) : '';
            ts[k].textContent = prefix;
            ts[k].setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
            var run = ts[k].parentNode;
            var rPr = run.getElementsByTagNameNS(W, 'rPr')[0];
            var rPrXml = rPr ? xs.serializeToString(rPr) : '';
            var xml = v.type === 'image'
              ? (function () {
                  var sc = Math.min(maxW / v.w, maxH / v.h);
                  var cx = Math.round(v.w * sc), cy = Math.round(v.h * sc);
                  nextId += 1;
                  return imageRunXml(rIdFor(hit[1], v), nextId, cx, cy, '');
                })()
              : textRunXml(v.text, rPrXml);
            var frag = new dp().parseFromString(xml, 'application/xml').documentElement;
            var newRun = doc.importNode(frag, true);
            run.parentNode.insertBefore(newRun, run.nextSibling);
            if (suffix) {
              var sufRun = doc.importNode(new dp().parseFromString(textRunXml(suffix, rPrXml), 'application/xml').documentElement, true);
              run.parentNode.insertBefore(sufRun, newRun.nextSibling);
            }
          } else {
            ts[k].textContent = txt.slice(0, cutA) + txt.slice(cutB);
          }
        }
        count += 1;
      }
    }

    if (!/Extension="png"/i.test(ctXml)) {
      ctXml = ctXml.replace('<Types', '<Types').replace(/(<Types[^>]*>)/, '$1<Default Extension="png" ContentType="image/png"/>');
    }

    function ser(d) {
      var out = xs.serializeToString(d);
      if (!/^<\?xml/.test(out)) out = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + out;
      return out;
    }
    zip.file('word/document.xml', ser(doc));
    zip.file(relsPath, ser(rels));
    zip.file('[Content_Types].xml', ctXml);
    var bytes = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    return { bytes: bytes, count: count };
  }

  return { scan: scan, fill: fill, isSign: isSign, isDate: isDate };
})();

</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), pad = $('pad'), cv = $('cv'), ctx = cv.getContext('2d'), safe = $('safe');
  var btnUndo = $('undo'), btnClear = $('clear'), btnOk = $('ok');
  var done = $('done'), out = $('out'), preview = $('preview'), chkT = $('transparent'), note = $('note');
  var btnBack = $('back'), btnSave = $('save');
  var docinfo = $('docinfo'), target = $('target'), hint = $('hint');
  var openBtn = $('openBtn'), toDoc = $('toDoc');
  var docview = $('docview'), docbody = $('docbody'), dvName = $('dvName'), dvCount = $('dvCount');
  var dvSave = $('dvSave'), dvNote = $('dvNote'), dvClose = $('dvClose');

  var INK = '#14213d', MIN_W = 1.4, MAX_W = 4.2;
  var strokes = [], cur = null, activeId = null, lastT = 0;
  var W = 0, H = 0, dpr = 1, rotated = false;

  /* Word 檔狀態 */
  var docFile = null;      // {name, data, marks, signNames}
  var signed = {};         // 簽名欄名稱 -> {png, w, h, url}
  var current = null;      // 正在簽的欄位
  var outDocFile = null, buildSeq = 0;

  /* ---------- 安全邊距：避開瀏海與底部橫條 ---------- */
  function applySafe() {
    var cs = getComputedStyle(safe);
    var t = parseFloat(cs.paddingTop) || 0, r = parseFloat(cs.paddingRight) || 0;
    var b = parseFloat(cs.paddingBottom) || 0, l = parseFloat(cs.paddingLeft) || 0;
    var st = document.documentElement.style;
    // 舞台轉 90° 時：舞台左邊＝螢幕上方、舞台右邊＝螢幕下方、舞台上方＝螢幕右邊、舞台下方＝螢幕左邊
    var top = rotated ? r : t, right = rotated ? b : r, bottom = rotated ? l : b, left = rotated ? t : l;
    st.setProperty('--pt', Math.max(10, top + 6) + 'px');
    st.setProperty('--pr', Math.max(16, right + 6) + 'px');
    st.setProperty('--pb', Math.max(12, bottom + 6) + 'px');
    st.setProperty('--pl', Math.max(16, left + 6) + 'px');
  }

  /* ---------- 舞台：永遠橫向 ---------- */
  function layoutStage() {
    var vw = window.innerWidth, vh = window.innerHeight;
    rotated = vh > vw;
    stage.style.width = (rotated ? vh : vw) + 'px';
    stage.style.height = (rotated ? vw : vh) + 'px';
    stage.style.transform = rotated ? 'rotate(90deg) translateY(-100%)' : 'none';
    applySafe();
    resize();
    fitDoc();
  }

  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function today() { var d = new Date(); return d.getFullYear() + '/' + p2(d.getMonth() + 1) + '/' + p2(d.getDate()); }
  function tick() { var d = new Date(); $('stamp').textContent = today() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  tick(); setInterval(tick, 20000);

  /* ---------- 畫筆 ---------- */
  function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
  function setup(c) { c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = INK; c.fillStyle = INK; }
  function seg(c, pts, i) {
    if (i < 1) return;
    var a = pts[i - 1], b = pts[i];
    c.beginPath(); c.lineWidth = (a.w + b.w) / 2;
    if (i === 1) { var m = mid(a, b); c.moveTo(a.x, a.y); c.lineTo(m.x, m.y); }
    else { var m0 = mid(pts[i - 2], a), m1 = mid(a, b); c.moveTo(m0.x, m0.y); c.quadraticCurveTo(a.x, a.y, m1.x, m1.y); }
    c.stroke();
  }
  function tail(c, pts) {
    var n = pts.length;
    if (n === 1) { c.beginPath(); c.arc(pts[0].x, pts[0].y, Math.max(pts[0].w, 2.4) / 2, 0, Math.PI * 2); c.fill(); return; }
    var a = pts[n - 2], b = pts[n - 1], m = mid(a, b);
    c.beginPath(); c.lineWidth = b.w; c.moveTo(m.x, m.y); c.lineTo(b.x, b.y); c.stroke();
  }
  function drawStroke(c, pts) { for (var i = 1; i < pts.length; i++) seg(c, pts, i); tail(c, pts); }
  function redraw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H); setup(ctx);
    for (var i = 0; i < strokes.length; i++) drawStroke(ctx, strokes[i]);
  }
  function resize() {
    var nw = pad.clientWidth, nh = pad.clientHeight;
    if (!nw || !nh) return;
    if (W && H && (nw !== W || nh !== H) && strokes.length) {
      var s = Math.min(nw / W, nh / H), ox = (nw - W * s) / 2, oy = (nh - H * s) / 2;
      strokes.forEach(function (pts) { pts.forEach(function (p) { p.x = p.x * s + ox; p.y = p.y * s + oy; p.w *= s; }); });
    }
    W = nw; H = nh;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    redraw();
  }
  window.addEventListener('resize', layoutStage);
  window.addEventListener('orientationchange', function () { setTimeout(layoutStage, 250); });

  function refresh() {
    var has = strokes.length > 0;
    pad.classList.toggle('signed', has || !!cur);
    btnUndo.disabled = !has; btnClear.disabled = !has; btnOk.disabled = !has;
  }
  function clearPad() { strokes = []; redraw(); refresh(); }

  /* ---------- 輸入 ---------- */
  function pos(e) {
    var r = cv.getBoundingClientRect();
    if (rotated) return { x: e.clientY - r.top, y: r.right - e.clientX };
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function addPoint(e) {
    var p = pos(e), last = cur[cur.length - 1];
    var dx = p.x - last.x, dy = p.y - last.y, dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.6) return;
    var t = e.timeStamp || Date.now(), dt = Math.max(t - lastT, 1); lastT = t;
    var v = dist / dt, tw;
    if (e.pointerType === 'pen' && e.pressure > 0) tw = MIN_W + (MAX_W - MIN_W) * Math.min(e.pressure * 1.4, 1);
    else tw = Math.max(MIN_W, Math.min(MAX_W, MAX_W - v * 1.5));
    p.w = last.w * 0.7 + tw * 0.3;
    cur.push(p); seg(ctx, cur, cur.length - 1);
  }
  cv.addEventListener('pointerdown', function (e) {
    if (activeId !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); activeId = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    var p = pos(e); p.w = 2.6; cur = [p]; lastT = e.timeStamp || Date.now();
    setup(ctx); pad.classList.add('signed');
  });
  cv.addEventListener('pointermove', function (e) {
    if (e.pointerId !== activeId || !cur) return;
    e.preventDefault();
    var list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (list && list.length) { for (var i = 0; i < list.length; i++) addPoint(list[i]); } else addPoint(e);
  });
  function end(e) {
    if (e.pointerId !== activeId || !cur) return;
    tail(ctx, cur); strokes.push(cur); cur = null; activeId = null; refresh();
  }
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  ['touchstart', 'touchmove', 'gesturestart'].forEach(function (n) {
    pad.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  btnUndo.addEventListener('click', function () { strokes.pop(); redraw(); refresh(); });
  btnClear.addEventListener('click', clearPad);

  /* ---------- 簽名轉圖 ---------- */
  function render(transparent, scale) {
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    strokes.forEach(function (pts) { pts.forEach(function (p) {
      if (p.x < x0) x0 = p.x; if (p.y < y0) y0 = p.y; if (p.x > x1) x1 = p.x; if (p.y > y1) y1 = p.y;
    }); });
    var padPx = 12; scale = scale || 3;
    x0 = Math.max(0, x0 - padPx); y0 = Math.max(0, y0 - padPx);
    x1 = Math.min(W, x1 + padPx); y1 = Math.min(H, y1 + padPx);
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round((x1 - x0) * scale));
    c.height = Math.max(1, Math.round((y1 - y0) * scale));
    var g = c.getContext('2d');
    if (!transparent) { g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); }
    g.setTransform(scale, 0, 0, scale, -x0 * scale, -y0 * scale);
    setup(g); strokes.forEach(function (pts) { drawStroke(g, pts); });
    return c;
  }
  function dataUrlToBytes(url) {
    var bin = atob(url.split(',')[1]), n = bin.length, arr = new Uint8Array(n);
    for (var i = 0; i < n; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  /* ---------- 開啟 Word ---------- */
  function setInfo(html, err) { docinfo.innerHTML = html; docinfo.classList.toggle('err', !!err); }
  function setDvNote(text, err) { dvNote.textContent = text; dvNote.classList.toggle('err', !!err); }
  function escH(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var DEPS = function () { return { JSZip: JSZip, DOMParser: DOMParser, XMLSerializer: XMLSerializer }; };

  $('file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (/\.doc$/i.test(f.name)) { setInfo('這是舊版 .doc，請在 Word 另存成 .docx 再開啟', true); return; }
    if (typeof JSZip === 'undefined' || typeof docx === 'undefined') { setInfo('Word 功能需要網路載入，請連上網路後重新整理', true); return; }
    setInfo('讀取中…');
    var buf;
    f.arrayBuffer().then(function (b) {
      buf = b;
      return JSZip.loadAsync(b).then(function (zip) {
        var x = zip.file('word/document.xml');
        if (!x) throw new Error('notdocx');
        return x.async('string');
      });
    }).then(function (xml) {
      var marks = DocxFill.scan(xml, DOMParser);
      var signNames = marks.filter(function (m) { return m.kind === 'sign'; }).map(function (m) { return m.name; });
      if (!signNames.length) { setInfo('<b>' + escH(f.name) + '</b> 裡找不到 {{簽名}} 標記', true); return; }
      docFile = { name: f.name, data: buf, marks: marks, signNames: signNames };
      signed = {}; outDocFile = null; buildSeq++;
      setInfo('<b>' + escH(f.name) + '</b>');
      return showDoc();
    }).catch(function () {
      setInfo('無法讀取這個檔案，請確認是 .docx 格式', true);
    });
  });

  /* 把標記換成記號再交給 docx-preview 顯示，然後把記號換成可以點的簽名框 */
  function showDoc() {
    var values = {};
    docFile.marks.forEach(function (m, i) {
      if (m.kind === 'sign') values[m.name] = { type: 'text', text: '⟦S' + docFile.signNames.indexOf(m.name) + '⟧' };
      if (m.kind === 'date') values[m.name] = { type: 'text', text: today() };
    });
    dvName.textContent = docFile.name;
    docbody.innerHTML = '';
    setDvNote('文件載入中…');
    docview.classList.add('show');
    updateCount();
    return DocxFill.fill(docFile.data, values, DEPS()).then(function (r) {
      return docx.renderAsync(r.bytes, docbody, null, {
        className: 'docx', inWrapper: true, ignoreWidth: false, ignoreHeight: false,
        breakPages: true, ignoreLastRenderedPageBreak: true, useBase64URL: true,
        renderHeaders: true, renderFooters: true, renderFootnotes: true
      });
    }).then(function () {
      makeSpots();
      fitDoc();
      setDvNote('點藍色閃爍的框簽名。簽完全部後按「儲存 Word」。');
    }).catch(function () {
      setDvNote('這份文件無法顯示。請在電腦用 Word 另存一次 .docx 後再試。', true);
    });
  }

  function makeSpots() {
    var walker = document.createTreeWalker(docbody, NodeFilter.SHOW_TEXT, null), nodes = [], n;
    while ((n = walker.nextNode())) if (n.nodeValue.indexOf('⟦S') >= 0) nodes.push(n);
    nodes.forEach(function (node) {
      var parts = node.nodeValue.split(/(⟦S\d+⟧)/), frag = document.createDocumentFragment();
      parts.forEach(function (part) {
        var m = /^⟦S(\d+)⟧$/.exec(part);
        if (!m) { if (part) frag.appendChild(document.createTextNode(part)); return; }
        var name = docFile.signNames[+m[1]];
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'sigspot'; b.setAttribute('data-name', name);
        paintSpot(b, name);
        frag.appendChild(b);
      });
      node.parentNode.replaceChild(frag, node);
    });
  }
  function paintSpot(b, name) {
    var s = signed[name];
    b.classList.toggle('is-signed', !!s);
    b.innerHTML = '';
    if (s) { var img = new Image(); img.alt = name; img.src = s.url; b.appendChild(img); b.setAttribute('aria-label', '重新簽：' + name); }
    else { b.textContent = '點此簽名：' + name; b.setAttribute('aria-label', '簽名：' + name); }
  }
  function repaintSpots() {
    var bs = docbody.querySelectorAll('.sigspot');
    for (var i = 0; i < bs.length; i++) paintSpot(bs[i], bs[i].getAttribute('data-name'));
  }
  docbody.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.sigspot');
    if (!b) return;
    openPad(b.getAttribute('data-name'));
  });

  function fitDoc() {
    var w = docbody.querySelector('.docx-wrapper');
    if (!w || !docview.classList.contains('show')) return;
    w.style.zoom = 1;
    var natural = 0, secs = w.querySelectorAll('section.docx');
    for (var i = 0; i < secs.length; i++) natural = Math.max(natural, secs[i].offsetWidth);
    natural += 32;   // 左右灰邊
    var avail = docbody.clientWidth;
    if (natural && avail) w.style.zoom = Math.min(1, avail / natural);
  }

  function updateCount() {
    if (!docFile) return;
    var total = docFile.signNames.length;
    var n = docFile.signNames.filter(function (k) { return signed[k]; }).length;
    dvCount.textContent = n === total ? '全部簽好了（' + n + '/' + total + '）' : '已簽 ' + n + ' / ' + total;
    dvCount.classList.toggle('ok', n === total);
  }

  /* ---------- 文件 ⇄ 簽名板 ---------- */
  function openPad(name) {
    current = name;
    var total = docFile.signNames.length, idx = docFile.signNames.indexOf(name) + 1;
    target.hidden = false;
    target.textContent = '請簽：' + name + (total > 1 ? '（' + idx + '/' + total + '）' : '');
    hint.textContent = '請在此簽名：' + name;
    setInfo('<b>' + escH(docFile.name) + '</b>');
    openBtn.hidden = true; toDoc.hidden = false;
    clearPad();
    docview.classList.remove('show');
    resize();
  }
  function backToDoc() {
    current = null;
    target.hidden = true; hint.textContent = '請在此簽名';
    docview.classList.add('show');
    fitDoc();
  }
  toDoc.addEventListener('click', backToDoc);

  dvClose.addEventListener('click', function () {
    docFile = null; signed = {}; current = null; outDocFile = null; buildSeq++;
    docbody.innerHTML = '';
    docview.classList.remove('show');
    openBtn.hidden = false; toDoc.hidden = true; target.hidden = true;
    hint.textContent = '請在此簽名';
    setInfo('開啟 Word 後，點文件裡的簽名框就能簽');
    dvSave.disabled = true;
    clearPad();
  });

  /* 全部簽好後先在背景做好 Word 檔，按「儲存 Word」時能立刻叫出分享選單 */
  function buildDoc() {
    var all = docFile.signNames.every(function (k) { return signed[k]; });
    outDocFile = null; dvSave.disabled = true;
    if (!all) return;
    var seq = ++buildSeq, file = docFile;
    var values = {};
    file.marks.forEach(function (m) {
      if (m.kind === 'sign') values[m.name] = { type: 'image', png: signed[m.name].png, w: signed[m.name].w, h: signed[m.name].h };
      if (m.kind === 'date') values[m.name] = { type: 'text', text: today() };
    });
    setDvNote('正在產生簽好的 Word…');
    DocxFill.fill(file.data, values, DEPS(), { maxW: 5, maxH: 1.4 }).then(function (r) {
      if (seq !== buildSeq) return;
      outDocFile = new File([r.bytes], signedName(), { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      dvSave.disabled = false;
      setDvNote('全部簽好了。按「儲存 Word」，在分享選單選「儲存到檔案」或直接傳出。點簽名可以重簽。');
    }).catch(function () {
      if (seq !== buildSeq) return;
      setDvNote('產生 Word 失敗。請在電腦用 Word 另存一次 .docx 後再試。', true);
    });
  }
  function signedName() {
    var base = docFile ? docFile.name.replace(/\.docx$/i, '') : '文件';
    var d = new Date();
    return base + '_已簽名_' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '.docx';
  }

  /* ---------- 確認 ---------- */
  var outFile = null;
  function pngName() {
    var d = new Date();
    return '簽名_' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '_' + p2(d.getHours()) + p2(d.getMinutes()) + '.png';
  }
  function showImageOnly() {
    var url = render(chkT.checked).toDataURL('image/png');
    out.src = url;
    outFile = new File([dataUrlToBytes(url)], pngName(), { type: 'image/png' });
    preview.classList.toggle('clear-bg', chkT.checked);
  }

  btnOk.addEventListener('click', function () {
    if (!strokes.length) return;
    if (docFile && current) {
      var c = render(true, 3), url = c.toDataURL('image/png');
      signed[current] = { png: dataUrlToBytes(url), w: c.width, h: c.height, url: url };
      repaintSpots(); updateCount();
      backToDoc();
      buildDoc();
      return;
    }
    showImageOnly();
    note.className = 'note'; note.textContent = '按「儲存圖片」，或長按圖片存到照片。';
    done.classList.add('show');
  });
  chkT.addEventListener('change', showImageOnly);
  btnBack.addEventListener('click', function () { done.classList.remove('show'); clearPad(); });

  /* ---------- 儲存：Claude 內用下載、iPhone 用分享選單、電腦直接下載 ---------- */
  var downloads = null;
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function (d) { if (d) downloads = d; }).catch(function () {});
  }
  function saveFile(file, btn, say) {
    if (downloads) {
      btn.disabled = true;
      downloads.save({ filename: file.name, data: file }).then(function () {
        say('已送出儲存：' + file.name);
      }).catch(function (err) {
        var code = err && err.code;
        if (code === 'declined') say('已取消儲存。');
        else if (code === 'rate_limited') say('請稍等一下再按一次。', true);
        else say('這裡無法直接儲存檔案。', true);
      }).then(function () { btn.disabled = false; });
      return;
    }
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(function () {
        say('已完成：' + file.name);
      }).catch(function (err) {
        if (err && err.name === 'AbortError') say('已取消。');
        else say('無法開啟分享選單。', true);
      });
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    say('已下載：' + file.name);
  }
  btnSave.addEventListener('click', function () {
    if (outFile) saveFile(outFile, btnSave, function (t, err) { note.className = 'note' + (err ? ' err' : ''); note.textContent = t; });
  });
  dvSave.addEventListener('click', function () { if (outDocFile) saveFile(outDocFile, dvSave, setDvNote); });

  /* ---------- 離線使用 ---------- */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  layoutStage();
  refresh();
})();
</script>
</body>
</html>
