<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>簽名板</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="簽名板">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f9d55">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* 版面：永遠橫向。左邊大簽名紙，右邊一排直立按鍵（像刷卡機側鍵）。手機直拿時整個舞台轉 90°。 */
:root {
  --bg: #e4e7ea;
  --panel: #f6f7f8;
  --text: #1b2430;
  --muted: #647080;
  --line: #c5ccd3;
  --paper: #fdfdf9;
  --key-clear: #f2c230;
  --key-clear-text: #3a2c00;
  --key-ok: #1f9d55;
  --key-ok-text: #ffffff;
  --key-plain: #ffffff;
  --font-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* 瀏海與底部橫條的安全邊距（由 JS 依方向換算） */
  --pt: 10px; --pr: 16px; --pb: 12px; --pl: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181d; --panel: #1e242b; --text: #e8ecf0; --muted: #94a0ad;
    --line: #36404b; --paper: #f3f1e8; --key-plain: #2a323b;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body {
  color: var(--text); font-family: var(--font-body);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#safe {
  position: fixed; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* 舞台：由 JS 設定寬高；直拿時旋轉 */
#stage {
  position: fixed; left: 0; top: 0;
  transform-origin: 0 0;
  background: var(--bg);
}
.app {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: 1fr 112px; gap: 12px;
  padding: var(--pt) var(--pr) var(--pb) var(--pl);
}
.left { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .04em; }
.stamp { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.pad {
  position: relative; flex: 1; min-height: 0;
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; touch-action: none;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.guide {
  position: absolute; left: 5%; right: 5%; bottom: 26%;
  border-bottom: 1.5px dashed #9aa3ad; pointer-events: none;
}
.guide::before {
  content: "✕"; position: absolute; left: 0; bottom: 6px;
  font-size: 22px; color: #7a8591; line-height: 1;
}
.hint {
  position: absolute; left: 0; right: 0; bottom: calc(26% - 30px);
  text-align: center; font-size: 14px; color: #7a8591; letter-spacing: .2em;
  pointer-events: none; transition: opacity .2s;
}
.pad.signed .hint { opacity: 0; }

.keys { display: flex; flex-direction: column; gap: 10px; }
.keys button { flex: 1; }
.keys .k-ok { flex: 1.5; }
button {
  font: inherit; font-size: 17px; font-weight: 600;
  min-height: 48px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--key-plain); color: var(--text);
  cursor: pointer; touch-action: manipulation;
}
button:active { transform: translateY(1px); filter: brightness(.94); }
button:focus-visible { outline: 3px solid #4c8dff; outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; transform: none; filter: none; }
.k-clear { background: var(--key-clear); color: var(--key-clear-text); border-color: transparent; }
.k-ok { background: var(--key-ok); color: var(--key-ok-text); border-color: transparent; }

/* 完成畫面（同樣在舞台內，跟著轉） */
.done {
  position: absolute; inset: 0; background: var(--bg);
  display: none; grid-template-columns: 1fr 160px; gap: 12px;
  padding: var(--pt) var(--pr) var(--pb) var(--pl);
}
.done.show { display: grid; }
.done h2 { margin: 0; font-size: 16px; font-weight: 600; }
.preview {
  flex: 1; min-height: 0;
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; padding: 10px;
}
.preview.clear-bg {
  background-color: #fff;
  background-image:
    linear-gradient(45deg, #dfe3e7 25%, transparent 25%, transparent 75%, #dfe3e7 75%),
    linear-gradient(45deg, #dfe3e7 25%, transparent 25%, transparent 75%, #dfe3e7 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px;
}
.preview img {
  max-width: 100%; max-height: 100%; display: block;
  -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
}
.side { display: flex; flex-direction: column; gap: 10px; }
.side button { flex: 1; }
.opt { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 1.3; }
.opt input { width: 22px; height: 22px; flex: none; accent-color: var(--key-ok); }
.note { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.4; }

@media (prefers-reduced-motion: reduce) { .hint { transition: none; } button:active { transform: none; } }
</style>
</head>
<body>
<div id="safe"></div>
<div id="stage">
  <div class="app">
    <div class="left">
      <header>
        <h1>簽名板</h1>
        <span class="stamp" id="stamp"></span>
      </header>
      <div class="pad" id="pad">
        <div class="guide"></div>
        <div class="hint">請在此簽名</div>
        <canvas id="cv" aria-label="簽名區，用手指或觸控筆簽名"></canvas>
      </div>
    </div>
    <div class="keys">
      <button type="button" id="undo" disabled>復原</button>
      <button type="button" id="clear" class="k-clear" disabled>清除</button>
      <button type="button" id="ok" class="k-ok" disabled>確認</button>
    </div>
  </div>

  <div class="done" id="done" aria-live="polite">
    <div class="left">
      <h2>簽名完成</h2>
      <div class="preview" id="preview"><img id="out" alt="您的簽名"></div>
      <p class="note" id="note">按「儲存圖片」，或長按圖片存到照片。</p>
    </div>
    <div class="side">
      <label class="opt" for="transparent"><input type="checkbox" id="transparent"> 透明背景</label>
      <button type="button" id="save" class="k-ok">儲存圖片</button>
      <button type="button" id="back">重新簽名</button>
    </div>
  </div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var pad = document.getElementById('pad');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var btnUndo = document.getElementById('undo');
  var btnClear = document.getElementById('clear');
  var btnOk = document.getElementById('ok');
  var done = document.getElementById('done');
  var out = document.getElementById('out');
  var preview = document.getElementById('preview');
  var chkT = document.getElementById('transparent');
  var note = document.getElementById('note');
  var btnBack = document.getElementById('back');
  var btnSave = document.getElementById('save');
  var safe = document.getElementById('safe');

  var INK = '#14213d';
  var MIN_W = 1.4, MAX_W = 4.2;
  var strokes = [], cur = null, activeId = null, lastT = 0;
  var W = 0, H = 0, dpr = 1;
  var rotated = false;

  /* ---------- 安全邊距：避開瀏海與底部橫條 ---------- */
  function applySafe() {
    var cs = getComputedStyle(safe);
    var t = parseFloat(cs.paddingTop) || 0, r = parseFloat(cs.paddingRight) || 0;
    var b = parseFloat(cs.paddingBottom) || 0, l = parseFloat(cs.paddingLeft) || 0;
    var st = document.documentElement.style;
    // 舞台轉 90° 時：舞台左邊＝螢幕上方、舞台右邊＝螢幕下方、舞台上方＝螢幕右邊、舞台下方＝螢幕左邊
    var top = rotated ? r : t, right = rotated ? b : r, bottom = rotated ? l : b, left = rotated ? t : l;
    st.setProperty('--pt', Math.max(10, top + 6) + 'px');
    st.setProperty('--pr', Math.max(16, right + 6) + 'px');
    st.setProperty('--pb', Math.max(12, bottom + 6) + 'px');
    st.setProperty('--pl', Math.max(16, left + 6) + 'px');
  }

  /* ---------- 舞台：永遠橫向 ---------- */
  function layoutStage() {
    var vw = window.innerWidth, vh = window.innerHeight;
    rotated = vh > vw;
    if (rotated) {
      stage.style.width = vh + 'px';
      stage.style.height = vw + 'px';
      stage.style.transform = 'rotate(90deg) translateY(-100%)';
    } else {
      stage.style.width = vw + 'px';
      stage.style.height = vh + 'px';
      stage.style.transform = 'none';
    }
    applySafe();
    resize();
  }

  /* ---------- 時間戳 ---------- */
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date();
    document.getElementById('stamp').textContent =
      d.getFullYear() + '/' + p2(d.getMonth() + 1) + '/' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  tick(); setInterval(tick, 20000);

  /* ---------- 畫筆 ---------- */
  function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
  function setup(c) { c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = INK; c.fillStyle = INK; }
  function seg(c, pts, i) {
    if (i < 1) return;
    var a = pts[i - 1], b = pts[i];
    c.beginPath();
    c.lineWidth = (a.w + b.w) / 2;
    if (i === 1) { var m = mid(a, b); c.moveTo(a.x, a.y); c.lineTo(m.x, m.y); }
    else { var m0 = mid(pts[i - 2], a), m1 = mid(a, b); c.moveTo(m0.x, m0.y); c.quadraticCurveTo(a.x, a.y, m1.x, m1.y); }
    c.stroke();
  }
  function tail(c, pts) {
    var n = pts.length;
    if (n === 1) { c.beginPath(); c.arc(pts[0].x, pts[0].y, Math.max(pts[0].w, 2.4) / 2, 0, Math.PI * 2); c.fill(); return; }
    var a = pts[n - 2], b = pts[n - 1], m = mid(a, b);
    c.beginPath(); c.lineWidth = b.w; c.moveTo(m.x, m.y); c.lineTo(b.x, b.y); c.stroke();
  }
  function drawStroke(c, pts) { for (var i = 1; i < pts.length; i++) seg(c, pts, i); tail(c, pts); }
  function redraw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    setup(ctx);
    for (var i = 0; i < strokes.length; i++) drawStroke(ctx, strokes[i]);
  }

  /* ---------- 尺寸：用未旋轉的版面尺寸 ---------- */
  function resize() {
    var nw = pad.clientWidth, nh = pad.clientHeight;
    if (!nw || !nh) return;
    if (W && H && (nw !== W || nh !== H) && strokes.length) {
      var s = Math.min(nw / W, nh / H);
      var ox = (nw - W * s) / 2, oy = (nh - H * s) / 2;
      strokes.forEach(function (pts) { pts.forEach(function (p) { p.x = p.x * s + ox; p.y = p.y * s + oy; p.w *= s; }); });
    }
    W = nw; H = nh;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    redraw();
  }
  window.addEventListener('resize', layoutStage);
  window.addEventListener('orientationchange', function () { setTimeout(layoutStage, 250); });
  layoutStage();

  function refresh() {
    var has = strokes.length > 0;
    pad.classList.toggle('signed', has || !!cur);
    btnUndo.disabled = !has; btnClear.disabled = !has; btnOk.disabled = !has;
  }

  /* ---------- 輸入：把螢幕座標換回畫布座標 ---------- */
  function pos(e) {
    var r = cv.getBoundingClientRect();
    if (rotated) return { x: e.clientY - r.top, y: r.right - e.clientX };
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function addPoint(e) {
    var p = pos(e), last = cur[cur.length - 1];
    var dx = p.x - last.x, dy = p.y - last.y, dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.6) return;
    var t = e.timeStamp || Date.now(), dt = Math.max(t - lastT, 1);
    lastT = t;
    var v = dist / dt, target;
    if (e.pointerType === 'pen' && e.pressure > 0) target = MIN_W + (MAX_W - MIN_W) * Math.min(e.pressure * 1.4, 1);
    else target = Math.max(MIN_W, Math.min(MAX_W, MAX_W - v * 1.5));
    p.w = last.w * 0.7 + target * 0.3;
    cur.push(p);
    seg(ctx, cur, cur.length - 1);
  }
  cv.addEventListener('pointerdown', function (e) {
    if (activeId !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    activeId = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    var p = pos(e); p.w = 2.6;
    cur = [p]; lastT = e.timeStamp || Date.now();
    setup(ctx);
    pad.classList.add('signed');
  });
  cv.addEventListener('pointermove', function (e) {
    if (e.pointerId !== activeId || !cur) return;
    e.preventDefault();
    var list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (list && list.length) { for (var i = 0; i < list.length; i++) addPoint(list[i]); }
    else addPoint(e);
  });
  function end(e) {
    if (e.pointerId !== activeId || !cur) return;
    tail(ctx, cur);
    strokes.push(cur);
    cur = null; activeId = null;
    refresh();
  }
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  ['touchstart', 'touchmove', 'gesturestart'].forEach(function (n) {
    pad.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  btnUndo.addEventListener('click', function () { strokes.pop(); redraw(); refresh(); });
  btnClear.addEventListener('click', function () { strokes = []; redraw(); refresh(); });

  /* ---------- 輸出 ---------- */
  function render(transparent) {
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    strokes.forEach(function (pts) { pts.forEach(function (p) {
      if (p.x < x0) x0 = p.x; if (p.y < y0) y0 = p.y; if (p.x > x1) x1 = p.x; if (p.y > y1) y1 = p.y;
    }); });
    var padPx = 24, scale = 3;
    x0 = Math.max(0, x0 - padPx); y0 = Math.max(0, y0 - padPx);
    x1 = Math.min(W, x1 + padPx); y1 = Math.min(H, y1 + padPx);
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round((x1 - x0) * scale));
    c.height = Math.max(1, Math.round((y1 - y0) * scale));
    var g = c.getContext('2d');
    if (!transparent) { g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); }
    g.setTransform(scale, 0, 0, scale, -x0 * scale, -y0 * scale);
    setup(g);
    strokes.forEach(function (pts) { drawStroke(g, pts); });
    return c;
  }

  function fileName() {
    var d = new Date();
    return '簽名_' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '_' + p2(d.getHours()) + p2(d.getMinutes()) + '.png';
  }
  // 事先把圖片轉成檔案，按「儲存圖片」時可以立刻叫出分享選單（iPhone 要求在按下當下呼叫）
  function dataUrlToFile(url, name) {
    var parts = url.split(','), bin = atob(parts[1]), n = bin.length, arr = new Uint8Array(n);
    for (var i = 0; i < n; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], name, { type: 'image/png' });
  }

  var outUrl = '', outFile = null;
  function showOut() {
    outUrl = render(chkT.checked).toDataURL('image/png');
    out.src = outUrl;
    outFile = dataUrlToFile(outUrl, fileName());
    preview.classList.toggle('clear-bg', chkT.checked);
  }
  btnOk.addEventListener('click', function () {
    if (!strokes.length) return;
    showOut();
    note.textContent = '按「儲存圖片」，或長按圖片存到照片。';
    done.classList.add('show');
  });
  chkT.addEventListener('change', showOut);
  btnBack.addEventListener('click', function () {
    done.classList.remove('show');
    strokes = []; redraw(); refresh();
  });

  /* ---------- 儲存：iPhone 用分享選單（選「儲存影像」），電腦直接下載 ---------- */
  btnSave.addEventListener('click', function () {
    if (!outFile) return;
    if (navigator.canShare && navigator.canShare({ files: [outFile] })) {
      navigator.share({ files: [outFile] }).then(function () {
        note.textContent = '已完成。';
      }).catch(function (err) {
        if (err && err.name === 'AbortError') note.textContent = '已取消。';
        else note.textContent = '無法開啟分享選單，請長按圖片儲存。';
      });
      return;
    }
    var a = document.createElement('a');
    a.href = outUrl; a.download = outFile.name;
    document.body.appendChild(a); a.click(); a.remove();
    note.textContent = '已下載：' + outFile.name;
  });

  refresh();

  /* ---------- 離線使用 ---------- */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
